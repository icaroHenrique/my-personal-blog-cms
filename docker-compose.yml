services:
  postgres:
    image: postgres:15-alpine
    container_name: payload_cms_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload_password
      POSTGRES_DB: payload_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d payload_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
